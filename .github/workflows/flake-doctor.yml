# Prototype Flake Doctor GitHub Actions Workflow
# NOTE: Prototype, not production-tested.
name: Flake Doctor CI Forensic Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  forensic-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake Doctor Diagnostic Sweep
        run: |
          python -m flakedoctor.cli scan demo_sick_repo/test_patient_zero.py --json autopsy_report.json --patch --fail-on-flaky

      - name: Archive Autopsy Report & Fix Patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-doctor-autopsy
          path: |
            autopsy_report.json
            fixes.patch
